name: Build and publish Python wheels

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: linux, windows, macos-intel, macos-arm64)'
        type: string
        default: 'linux,windows,macos-intel,macos-arm64'
        required: true
      python_versions:
        description: 'Python versions to build (comma-separated: 3.11 through 3.15)'
        type: string
        default: '3.11,3.12,3.13,3.14,3.15'
        required: true
      publish:
        description: 'Publish successful wheels (requires Trusted Publisher setup)'
        type: choice
        options: [artifacts, testpypi, pypi]
        default: artifacts
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      publish: ${{ steps.targets.outputs.publish }}
    steps:
      - name: Validate options and create matrix
        id: targets
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos-intel,macos-arm64' }}
          PYTHON_VERSIONS: ${{ inputs.python_versions || '3.11,3.12,3.13,3.14,3.15' }}
          PUBLISH: ${{ github.event_name == 'release' && 'pypi' || inputs.publish || 'artifacts' }}
        shell: python
        run: |
          import json
          import os

          runners = {
              'linux': 'ubuntu-24.04',
              'windows': 'windows-2022',
              'macos-intel': 'macos-15-intel',
              'macos-arm64': 'macos-15',
          }
          supported_versions = [f'3.{minor}' for minor in range(11, 16)]

          def select(name, supported):
              values = list(dict.fromkeys(value.strip() for value in os.environ[name].split(',')))
              if not values or any(value not in supported for value in values):
                  raise SystemExit(f'{name}: use a comma-separated selection from {", ".join(supported)}')
              return values

          platforms = select('PLATFORMS', runners)
          versions = select('PYTHON_VERSIONS', supported_versions)
          target = os.environ['PUBLISH']
          if target not in ('artifacts', 'testpypi', 'pypi'):
              raise SystemExit('PUBLISH must be artifacts, testpypi, or pypi')
          matrix = {'include': [
              {'os': runners[platform], 'python': version,
               'selector': 'cp' + version.replace('.', '') + '-*'}
              for platform in platforms for version in versions
          ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={json.dumps(matrix)}\n')
              output.write(f'publish={target}\n')

  build:
    name: Wheels (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SDK_SUBDIR: ${{ vars.STEAMWORKS_SDK_SUBDIR || '.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}, matching pyproject.toml')

      # GITHUB_TOKEN cannot read a different private repository.
      - name: Check SDK credentials
        env:
          SDK_TOKEN: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
        shell: python
        run: |
          import os
          if not os.environ['SDK_TOKEN']:
              raise SystemExit('Set STEAMWORKS_SDK_TOKEN to a token with Contents: read on TimSC/SteamworksSdk')

      - name: Check out private SDK
        uses: actions/checkout@v4
        with:
          repository: TimSC/SteamworksSdk
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          ref: ${{ vars.STEAMWORKS_SDK_REF }}
          path: _steamworks_sdk
          persist-credentials: false

      - name: Locate SDK
        shell: python
        run: |
          import os
          from pathlib import Path
          checkout = Path('_steamworks_sdk').resolve()
          sdk = (checkout / os.environ['SDK_SUBDIR']).resolve()
          if not sdk.is_relative_to(checkout):
              raise SystemExit('STEAMWORKS_SDK_SUBDIR must be inside the SDK checkout')
          for relative in ('public/steam/steam_api.json', 'public/steam/steam_api_flat.h'):
              if not (sdk / relative).is_file():
                  raise SystemExit(f'Missing {sdk / relative}; configure STEAMWORKS_SDK_SUBDIR')
          # Linux builds run in a container where the checkout is /project.
          container_sdk = '/project/' + sdk.relative_to(Path.cwd()).as_posix()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'STEAMWORKS_SDK_DIR={sdk.as_posix()}\n')
              env.write(f'CIBW_ENVIRONMENT_LINUX=STEAMWORKS_SDK_DIR="{container_sdk}"\n')

      - name: Build and smoke test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.selector }}
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: native
          CIBW_ENVIRONMENT_MACOS: 'STEAMWORKS_SDK_DIR="${{ env.STEAMWORKS_SDK_DIR }}"'
          CIBW_ENVIRONMENT_WINDOWS: 'STEAMWORKS_SDK_DIR="${{ env.STEAMWORKS_SDK_DIR }}"'
          # setup.py already bundles the Windows runtime beside the extension.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ''
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_TEST_COMMAND: 'python -c "import steamworks; import steamworks._steamworks"'

      - name: Validate wheel metadata and contents
        shell: bash
        run: |
          python -m pip install 'twine>=6,<7'
          python -m twine check --strict wheelhouse/*.whl
          python tools/check_release_wheels.py wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to ${{ needs.prepare.outputs.publish }}
    # Manual runs can publish artifacts from successful matrix jobs even if others fail.
    # Releases still require every build to succeed.
    if: >-
      ${{ always() && !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.publish != 'artifacts' &&
          (needs.build.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.build.result == 'failure')) }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.prepare.outputs.publish }}
      url: ${{ needs.prepare.outputs.publish == 'testpypi' && 'https://test.pypi.org/p/steamworks-swig' || 'https://pypi.org/p/steamworks-swig' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish wheels using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ needs.prepare.outputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
